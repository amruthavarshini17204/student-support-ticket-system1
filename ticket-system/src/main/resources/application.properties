spring.application.name=student-support-ticket-system

# ---- Default: embedded H2 (file-based, persists across restarts) ----
# Chosen so the grader can run `mvn spring-boot:run` with zero setup.
spring.datasource.url=jdbc:h2:file:./data/ticketdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- To use MySQL instead: comment the H2 block above and uncomment below ----
#spring.datasource.url=jdbc:mysql://localhost:3306/edumerge_tickets?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=yourpassword
#spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
#spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=8080
